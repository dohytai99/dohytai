<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giới thiệu cá nhân</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: url('images/anh.jpg') no-repeat center center/cover;           
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            max-width: 400px;
        }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease-in-out;
            cursor: pointer;
        }

        .profile-img:hover {
            transform: scale(1.1);
        }

        h1 {
            color: #fff;
            margin-top: 10px;
            font-weight: 700;
        }

        p {
            color: #f1f1f1;
            font-weight: 300;
        }

        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            text-decoration: none;
            font-weight: 600;
            color: #fff;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 5px;
            transition: 0.3s;
        }

        .btn:hover {
            background: rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="images/vest.jpg" alt="Ảnh đại diện" class="profile-img" onclick="playClickSound()">
        <h1>Xin chào, tôi là Donald Tài</h1>
        <p>Tôi là một <b>Digital Entrepreneur</b>, đam mê <b>Kinh doanh điện tử</b>.  
        Trang web này giúp tôi kết nối với bạn.</p>
        <a href="mailto:dohytai99@gmail.com" class="btn">Liên hệ ngay</a>
        <a href="http://zalo.me/84907381975" class="btn" target="_blank">Kết nối Zalo</a>
    </div>

    <audio id="clickSound">
        <source src="sounds/click.ogg" type="audio/ogg">
    </audio>

    <script>
        const clickSound = document.getElementById('clickSound');

        function playClickSound() {
            clickSound.currentTime = 0;
            clickSound.play();
        }
    </script>
</body>
</html>
