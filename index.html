<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giới thiệu cá nhân</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(
                to bottom,
                rgba(0, 0, 0, 0) 0%,
                rgba(0, 0, 0, 0) 50%,
                rgba(0, 0, 0, 0.5) 100%
            ),
            url('images/anh.jpg') no-repeat center top/cover,
            url('images/anh2.jpg') no-repeat center bottom/cover;
            min-height: 200vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            background-attachment: fixed;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            max-width: 400px;
            margin-top: 20vh;
        }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease-in-out;
            cursor: pointer;
        }

        .profile-img:hover {
            transform: scale(1.1);
        }

        h1 {
            color: #fff;
            margin-top: 10px;
            font-weight: 700;
        }

        p {
            color: #f1f1f1;
            font-weight: 300;
        }

        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            text-decoration: none;
            font-weight: 600;
            color: #fff;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 5px;
            transition: 0.3s;
        }

        .btn:hover {
            background: rgba(0, 0, 0, 0.8);
        }

        .scroll-container {
            width: 100%;
            max-width: 400px;
            margin-top: 40px;
            text-align: center;
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
        }

        .scroll-text {
            color: #fff;
            margin-bottom: 10px;
            font-size: 14px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .scroll-arrow {
            color: #fff;
            font-size: 24px;
            animation: bounce 2s infinite;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-20px);
            }
            60% {
                transform: translateY(-10px);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="images/vest.jpg" alt="Ảnh đại diện" class="profile-img" onclick="playClickSound()">
        <h1>Xin chào, tôi là Donald Tài</h1>
        <p>Tôi là một <b>Digital Entrepreneur</b>, đam mê <b>Kinh doanh điện tử</b>.  
        Trang web này giúp tôi kết nối với bạn.</p>
        <a href="mailto:dohytai99@gmail.com" class="btn">Liên hệ ngay</a>
        <a href="http://zalo.me/84907381975" class="btn" target="_blank">Kết nối Zalo</a>
    </div>

    <div class="scroll-container">
        <div class="scroll-text">Kéo xuống để xem thêm</div>
        <div class="scroll-arrow">↓</div>
    </div>

    <audio id="clickSound" preload="auto">
        <source src="sounds/click.ogg" type="audio/ogg">
        <source src="sounds/click.mp3" type="audio/mpeg">
        Trình duyệt của bạn không hỗ trợ phát âm thanh.
    </audio>

    <script>
        const clickSound = document.getElementById('clickSound');

        function playClickSound() {
            try {
                clickSound.currentTime = 0;
                const playPromise = clickSound.play();
                
                if (playPromise !== undefined) {
                    playPromise.catch(error => {
                        console.log("Lỗi phát âm thanh:", error);
                    });
                }
            } catch (error) {
                console.log("Lỗi xử lý âm thanh:", error);
            }
        }

        // Tải trước âm thanh
        window.addEventListener('load', function() {
            clickSound.load();
        });

        // Ẩn mũi tên khi cuộn xuống đủ xa
        window.addEventListener('scroll', function() {
            const scrollContainer = document.querySelector('.scroll-container');
            if (window.scrollY > window.innerHeight) {
                scrollContainer.style.opacity = '0';
            } else {
                scrollContainer.style.opacity = '1';
            }
        });
    </script>
</body>
</html>
