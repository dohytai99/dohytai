<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giới thiệu cá nhân</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: url('images/anh.jpg') no-repeat center center/cover;           
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            max-width: 400px;
        }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease-in-out;
        }

        .profile-img:hover {
            transform: scale(1.1);
        }

        h1 {
            color: #fff;
            margin-top: 10px;
            font-weight: 700;
        }

        p {
            color: #f1f1f1;
            font-weight: 300;
        }

        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            text-decoration: none;
            font-weight: 600;
            color: #fff;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 5px;
            transition: 0.3s;
        }

        .btn:hover {
            background: rgba(0, 0, 0, 0.8);
        }

        .sound-controls {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .sound-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        .sound-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .sound-btn.active {
            background: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="images/vest.jpg" alt="Ảnh đại diện" class="profile-img">
        <h1>Xin chào, tôi là Donald Tài</h1>
        <p>Tôi là một <b>Digital Entrepreneur</b>, đam mê <b>Kinh doanh điện tử</b>.  
        Trang web này giúp tôi kết nối với bạn.</p>
        <a href="mailto:dohytai99@gmail.com" class="btn">Liên hệ ngay</a>
        <a href="http://zalo.me/84907381975" class="btn" target="_blank">Kết nối Zalo</a>
        
        <div class="sound-controls">
            <button class="sound-btn" onclick="toggleBackgroundMusic()">🎵 Nhạc nền</button>
            <button class="sound-btn" onclick="playHoverSound()">🔊 Hiệu ứng hover</button>
        </div>
    </div>

    <audio id="backgroundMusic" loop>
        <source src="sounds/background.mp3" type="audio/mpeg">
    </audio>
    <audio id="hoverSound">
        <source src="sounds/hover.mp3" type="audio/mpeg">
    </audio>

    <script>
        const backgroundMusic = document.getElementById('backgroundMusic');
        const hoverSound = document.getElementById('hoverSound');
        const soundBtns = document.querySelectorAll('.sound-btn');
        let isBackgroundMusicPlaying = false;

        function toggleBackgroundMusic() {
            if (isBackgroundMusicPlaying) {
                backgroundMusic.pause();
                soundBtns[0].classList.remove('active');
            } else {
                backgroundMusic.play();
                soundBtns[0].classList.add('active');
            }
            isBackgroundMusicPlaying = !isBackgroundMusicPlaying;
        }

        function playHoverSound() {
            hoverSound.currentTime = 0;
            hoverSound.play();
        }

        // Thêm hiệu ứng âm thanh khi hover vào các nút
        document.querySelectorAll('.btn').forEach(btn => {
            btn.addEventListener('mouseenter', () => {
                if (soundBtns[1].classList.contains('active')) {
                    hoverSound.currentTime = 0;
                    hoverSound.play();
                }
            });
        });

        // Thêm hiệu ứng âm thanh khi hover vào ảnh đại diện
        document.querySelector('.profile-img').addEventListener('mouseenter', () => {
            if (soundBtns[1].classList.contains('active')) {
                hoverSound.currentTime = 0;
                hoverSound.play();
            }
        });
    </script>
</body>
</html>
