<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script>
        async function processRequest() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const encodedToken = urlParams.get('token');
                const type = urlParams.get('type');
                
                if (!encodedToken) {
                    throw new Error('Thiếu token xác thực');
                }
                if (!type || (type !== 'sleep' && type !== 'wakeup')) {
                    throw new Error('Loại ghi nhận không hợp lệ');
                }

                const GITHUB_TOKEN = atob(encodedToken);
                const REPO_OWNER = 'dohytai99';
                const REPO_NAME = 'dohytai';
                const FILE_PATH = 'data/sleep_data.json';

                // 1. Lấy thời gian hiện tại theo múi giờ Việt Nam
                const now = new Date();
                const vietnamTime = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Ho_Chi_Minh' }));
                
                // 2. Tạo dữ liệu mới
                const newEntry = {
                    date: vietnamTime.toISOString().split('T')[0],
                    time: vietnamTime.toTimeString().split(' ')[0],
                    timestamp: vietnamTime.toISOString(),
                    type: type
                };

                // 3. Lấy nội dung file hiện tại từ GitHub
                const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });

                let currentContent = [];
                let sha = '';

                if (response.ok) {
                    const data = await response.json();
                    sha = data.sha;
                    currentContent = JSON.parse(atob(data.content));
                }

                // 4. Thêm dữ liệu mới
                currentContent.push(newEntry);

                // 5. Cập nhật file trên GitHub
                const updateResponse = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Ghi thời gian ${type === 'sleep' ? 'đi ngủ' : 'thức dậy'}: ${vietnamTime.toLocaleString('vi-VN')}`,
                        content: btoa(JSON.stringify(currentContent, null, 2)),
                        sha: sha
                    })
                });

                if (updateResponse.ok) {
                    const action = type === 'sleep' ? 'đi ngủ' : 'thức dậy';
                    const time = vietnamTime.toLocaleString('vi-VN', { timeZone: 'Asia/Ho_Chi_Minh' });
                    
                    document.write(JSON.stringify({
                        success: true,
                        message: `Đã ghi thời gian ${action}`,
                        time: time,
                        type: type
                    }));
                } else {
                    throw new Error('Không thể cập nhật dữ liệu');
                }
            } catch (error) {
                document.write(JSON.stringify({
                    success: false,
                    error: error.message
                }));
            }
        }

        // Xử lý ngay khi trang load
        processRequest();
    </script>
</head>
<body>
</body>
</html>
