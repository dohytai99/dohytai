<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logging Sleep Time</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 20px;
            text-align: center;
        }
        .success {
            color: #28a745;
            font-size: 1.5em;
            margin: 20px 0;
        }
        .time {
            color: #666;
            font-size: 1.2em;
        }
        .error {
            color: #dc3545;
            font-size: 1.2em;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div id="result">Đang ghi thời gian...</div>

    <script>
        // Lấy token từ URL parameter
        function getToken() {
            const urlParams = new URLSearchParams(window.location.search);
            const encodedToken = urlParams.get('token');
            if (!encodedToken) {
                throw new Error('Thiếu token xác thực');
            }
            // Giải mã token
            return atob(encodedToken);
        }

        const REPO_OWNER = 'dohytai99';
        const REPO_NAME = 'dohytai';
        const FILE_PATH = 'data/sleep_data.json';

        async function logSleepTime() {
            try {
                // Lấy token từ URL
                const GITHUB_TOKEN = getToken();

                // 1. Lấy thời gian hiện tại theo múi giờ Việt Nam
                const now = new Date();
                const vietnamTime = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Ho_Chi_Minh' }));
                
                // 2. Tạo dữ liệu mới
                const newEntry = {
                    date: vietnamTime.toISOString().split('T')[0],
                    time: vietnamTime.toTimeString().split(' ')[0],
                    timestamp: vietnamTime.toISOString()
                };

                // 3. Lấy nội dung file hiện tại từ GitHub
                const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });

                let currentContent = [];
                let sha = '';

                if (response.ok) {
                    const data = await response.json();
                    sha = data.sha;
                    currentContent = JSON.parse(atob(data.content));
                }

                // 4. Thêm dữ liệu mới
                currentContent.push(newEntry);

                // 5. Cập nhật file trên GitHub
                const updateResponse = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Ghi thời gian ngủ: ${vietnamTime.toLocaleString('vi-VN')}`,
                        content: btoa(JSON.stringify(currentContent, null, 2)),
                        sha: sha
                    })
                });

                if (updateResponse.ok) {
                    document.getElementById('result').innerHTML = `
                        <div class="success">✓ Đã ghi thời gian ngủ</div>
                        <div class="time">${vietnamTime.toLocaleString('vi-VN', { timeZone: 'Asia/Ho_Chi_Minh' })}</div>
                    `;
                } else {
                    throw new Error('Không thể cập nhật dữ liệu');
                }
            } catch (error) {
                document.getElementById('result').innerHTML = `
                    <div class="error">⚠ Có lỗi: ${error.message}</div>
                `;
            }
        }

        // Tự động ghi thời gian khi mở trang
        logSleepTime();
    </script>
</body>
</html>
