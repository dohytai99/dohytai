<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat GitHub - Real-time</title>
  <link rel="stylesheet" href="styles.css" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#0ea5e9" />
</head>
<body>
  <div class="app">
    <header>
      <h1>Chat GitHub</h1>
      <div class="user">
        <label for="username">Tên:</label>
        <input id="username" type="text" placeholder="Nhập tên..." maxlength="24" />
      </div>
    </header>

    <div class="setup" id="setup">
      <h3>Thiết lập GitHub</h3>
      <div class="form-group">
        <label for="token">GitHub Token:</label>
        <input id="token" type="password" value="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" />
      </div>
      <div class="form-group">
        <label for="repo">Repository:</label>
        <input id="repo" type="text" value="dohytai99/dohytai" />
      </div>
      <div class="form-group">
        <label for="branch">Branch:</label>
        <input id="branch" type="text" value="main" />
      </div>
      <button id="saveConfig" class="save-btn">Lưu cấu hình</button>
    </div>

    <main>
      <ul id="messages" class="messages"></ul>
    </main>

    <form id="form" autocomplete="off">
      <input id="input" placeholder="Nhập tin nhắn..." />
      <button type="submit">Gửi</button>
    </form>
    
    <div class="actions">
      <button id="refreshBtn" class="refresh-btn">Làm mới</button>
      <button id="exportBtn" class="export-btn">Xuất tin nhắn</button>
    </div>
  </div>
  
  <script src="github-chat.js"></script>
</body>
</html>
